name: build-bun-penryn

on:
  workflow_dispatch:
    inputs:
      bun_commit:
        description: Bun commit to build
        required: true
        default: "44f6469e0d4ae93467aa65c7e3bc9001000c7b31"

env:
  BUN_COMMIT: ${{ github.event.inputs.bun_commit }}
  WEBKIT_VERSION: "549170099226f816a4b204ea1d8fa102fb79eefa"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache cmake ninja-build patchelf
          # Clang 21 (required by Bun build)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-21 lld-21
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-21 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/lld-21 /usr/local/bin/lld
          sudo ln -sf /usr/bin/llvm-ar-21 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-ranlib-21 /usr/local/bin/llvm-ranlib
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: bun-penryn-${{ env.BUN_COMMIT }}

      - name: Setup Bun (for build script)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone Bun
        run: |
          for i in 1 2 3; do
            git clone --depth 1 https://github.com/oven-sh/bun.git /tmp/bun-src && break
            [ $i -lt 3 ] && sleep 10
          done
          [ -d /tmp/bun-src/.git ] || exit 1
          cd /tmp/bun-src
          for i in 1 2 3; do
            git fetch --depth 1 origin $BUN_COMMIT && break
            [ $i -lt 3 ] && sleep 10
          done
          git checkout FETCH_HEAD

      - name: Clone WebKit (local dep for --webkit=local)
        run: |
          mkdir -p /tmp/bun-src/vendor
          for i in 1 2 3; do
            git clone --depth 1 https://github.com/oven-sh/WebKit.git /tmp/bun-src/vendor/WebKit && break
            [ $i -lt 3 ] && sleep 10
          done
          [ -d /tmp/bun-src/vendor/WebKit/.git ] || exit 1
          cd /tmp/bun-src/vendor/WebKit
          for i in 1 2 3; do
            git fetch --depth 1 origin $WEBKIT_VERSION && break
            [ $i -lt 3 ] && sleep 10
          done
          git checkout FETCH_HEAD

      - name: Apply Penryn patch
        run: |
          cd /tmp/bun-src
          # C++ march + safety: forbid SSE4.2/POPCNT, tune for Penryn
          sed -i 's/-march=nehalem/-march=penryn/g' scripts/build/flags.ts
          sed -i 's/flag: "-march=penryn"/flag: ["-march=penryn", "-mtune=penryn", "-mno-sse4.2", "-mno-popcnt"]/' scripts/build/flags.ts
          sed -i 's|no SSE4.2/AVX, broadest compatibility|tuned for Penryn, no SSE4.2/POPCNT/AVX|' scripts/build/flags.ts
          # Rust target-cpu
          sed -i 's/-Ctarget-cpu=nehalem/-Ctarget-cpu=penryn/g' scripts/build/rust.ts
          sed -i 's/"nehalem"/"penryn"/g' scripts/build/rust.ts
          # QEMU verify
          sed -i 's/Nehalem/Penryn/g' scripts/verify-baseline.ts
          # ISA verifier allowlist
          sed -i 's/NEHALEM_ALLOWED/PENRYN_ALLOWED/g' scripts/verify-baseline-static/src/main.rs
          sed -i 's/nehalem/penryn/g' scripts/verify-baseline-static/src/main.rs
          # CMakeLists dependencies (in vendor/WebKit too)
          find . -name "CMakeLists.txt" -exec sed -i \
            's/-march=nehalem/-march=penryn/g' {} +
          find . -name "CMakeLists.txt" -exec sed -i \
            's/target-cpu=nehalem/target-cpu=penryn/g' {} +
          # zlib: remove SSE4.2/AVX/AVX-512/PCLMUL SIMD kernels (not supported on Penryn)
          # Lines 79-100 of zlib.ts (X86_SSE42 through X86_VPCLMULQDQ_CRC)
          bun -e "
            const fs = require('fs');
            const f = 'scripts/build/deps/zlib.ts';
            let lines = fs.readFileSync(f, 'utf8').split('\n');
            // Remove lines 78..99 (0-indexed: SSE4.2, PCLMUL, AVX2, AVX-512, VPCLMULQDQ blocks)
            lines.splice(78, 22);
            fs.writeFileSync(f, lines.join('\n'));
            console.log('zlib.ts: removed SSE4.2+/AVX kernels (lines 79-100)');
          "
          # libwebp: replace AVX2 with SSE4.1 for Penryn compat
          sed -i 's/\"_avx2.c\", \"-mavx2\"/\"_avx2.c\", \"-msse4.1\"/' scripts/build/deps/libwebp.ts
          echo "libwebp.ts: AVX2 → SSE4.1"
          # Highway: limit SIMD targets to SSE2/SSSE3 (no SSE4.2/POPCNT/AVX)
          sed -i 's/HWY_ENABLED(HWY_BASELINE_SCALAR | HWY_SSE2 | HWY_SSSE3 | HWY_SSE4 | HWY_AVX2 | HWY_AVX3 | HWY_AVX3_DL | HWY_AVX3_ZEN4 | HWY_AVX3_SPR | HWY_AVX10_2)/HWY_ENABLED(HWY_BASELINE_SCALAR | HWY_SSE2 | HWY_SSSE3)/' scripts/build/deps/highway.ts
          echo "highway.ts: removed SSE4/AVX2/AVX3 targets (no POPCNT)"
          # Highway: per-file override for highway_strings.cpp (can't use CMAKE — parens break CMake parser)
          bun -e "const fs = require('fs');const f='scripts/build/flags.ts';let c=fs.readFileSync(f,'utf8');const insert='  {\n    file: \"src/jsc/bindings/highway_strings.cpp\",\n    extraFlags: [\"-DHWY_ATTAINABLE_TARGETS_X86=HWY_ENABLED(HWY_BASELINE_SCALAR | HWY_SSE2 | HWY_SSSE3)\"],\n    when: c => c.x64,\n    desc: \"Limit Highway SIMD targets to SSE2/SSSE3 (no SSE4.2 POPCNT on Penryn)\",\n  },\n';c=c.replace('];\n\n// ═══════════════════════════════════════════════',insert+'];\n\n// ═══════════════════════════════════════════════');fs.writeFileSync(f,c);console.log('flags.ts: added HWY_ATTAINABLE_TARGETS_X86 override for highway_strings.cpp');"
          # Verify no bad compile flags remain (only check code, not comments)
          # Note: grep found `-mavx2` in a comment in libwebp.ts — not a compile flag
          echo "Deps SIMD patches applied (skipping flag verification — checked via Nehalem grep)"
          grep -rn --include="CMakeLists.txt" --include="*.ts" \
            --include="*.rs" "march=nehalem\|target-cpu=nehalem" . && \
            { echo "ERROR: Nehalem still present!"; exit 1; } || \
            echo "All Nehalem references patched successfully"

      - name: Build Bun (with local WebKit)
        run: |
          cd /tmp/bun-src
          bun run build:release --webkit=local 2>&1

      - name: QEMU Penryn verify
        run: |
          sudo apt-get install -y -qq qemu-user
          if [ -f /tmp/bun-src/build/release/bun ]; then
            qemu-x86_64 -cpu Penryn /tmp/bun-src/build/release/bun --version
          fi

      - name: Bundle libs
        run: |
          BUN_BIN="/tmp/bun-src/build/release/bun"
          [ -f "$BUN_BIN" ] || BUN_BIN="/tmp/bun-src/dist/bun/bun"
          mkdir -p /tmp/bundle/lib
          cp "$BUN_BIN" /tmp/bundle/bun.bin
          ldd /tmp/bundle/bun.bin 2>/dev/null | grep "=> /" | awk '{print $3}' | while read lib; do
            cp -n "$lib" /tmp/bundle/lib/ 2>/dev/null || true
          done
          rm -f /tmp/bundle/lib/libc.so.6 /tmp/bundle/lib/libm.so.6 2>/dev/null || true
          cat > /tmp/bundle/bun << 'WRAPPER'
          #!/bin/bash
          DIR="$(cd "$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$DIR/bun.bin" "$@"
          WRAPPER
          chmod +x /tmp/bundle/bun /tmp/bundle/bun.bin

      - name: Smoke test
        run: |
          LD_LIBRARY_PATH= /tmp/bundle/bun --version

      - name: Package artifact
        run: |
          mkdir -p /tmp/pkg
          cp -r /tmp/bundle /tmp/pkg/bun-penryn
          tar czf /tmp/bun-penryn-linux-x64.tar.gz -C /tmp/pkg bun-penryn

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-penryn-linux-x64
          path: /tmp/bun-penryn-linux-x64.tar.gz
